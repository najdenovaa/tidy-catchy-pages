name: Validate complete cementing report
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/*report*'
      - 'src/lib/cement-quality-index*'
      - 'src/components/CementQualitySection*'
      - 'src/lib/rheology-*'
      - 'src/lib/cement-mechanics*'
      - 'src/lib/elastic-cylinder*'
      - 'src/lib/casing-triaxial.ts'
      - 'src/components/CementMechanicsSection*'
      - 'src/workers/cementMechanics.worker.ts'
      - 'src/lib/__tests__/mechanics-report.test.ts'
      - 'src/lib/__tests__/fixtures/mechanics-fixture.ts'
      - 'src/lib/cement-thermal*'
      - 'src/components/CementThermalSection*'
      - 'src/workers/cementThermal.worker.ts'
      - 'src/lib/__tests__/thermal-report.test.ts'
      - 'src/lib/__tests__/fixtures/thermal-fixture.ts'
      - 'src/lib/fluid-*lab*'
      - 'src/components/FluidInteractionLab*'
      - 'src/components/FluidLabAnalysis*'
      - 'src/lib/__tests__/fluid-lab-report.test.ts'
      - 'src/lib/__tests__/fixtures/fluid-lab-fixture.ts'
      - 'src/lib/__tests__/hierarchy-chart-report.test.ts'
      - 'src/components/RheologyHierarchy*'
      - 'src/components/FannEditor*'
      - 'src/components/CementingChartData*'
      - 'src/lib/cementing-normalizers.ts'
      - 'src/lib/cementing-calculations.ts'
      - 'src/lib/basket-chart-data*'
      - 'src/lib/foam-chart-data*'
      - 'src/lib/foam-cement-report*'
      - 'src/components/FoamChartGallery*'
      - 'src/lib/__tests__/foam-chart-*'
      - 'src/lib/cement-basket-stop*'
      - 'src/components/BasketStopCard*'
      - 'src/lib/__tests__/basket-chart-report.test.ts'
      - 'src/lib/__tests__/rheology-chart-report.test.ts'
      - 'src/lib/cementing-chart-data*'
      - 'src/lib/depth-chart-settings*'
      - 'src/lib/chart-presentation*'
      - 'src/components/ChartPresentationEditor*'
      - 'src/lib/report-series-plot*'
      - 'src/components/DepthPressureCharts*'
      - 'src/components/CementingChartData*'
      - 'src/lib/centralizer-*'
      - 'src/lib/centralization-*'
      - 'src/lib/casing-running-*'
      - 'src/lib/casing-survey-mechanics*'
      - 'src/lib/casing-mechanics-controls.test.ts'
      - 'src/lib/casing-design-chart-data*'
      - 'src/lib/__tests__/casing-chart-*'
      - 'src/lib/__tests__/fixtures/casing-chart-fixture.ts'
      - 'src/components/CasingChartView*'
      - 'src/components/CasingRunningSection*'
      - 'src/components/ReportContentsDialog*'
      - 'src/lib/export-docx.ts'
      - 'src/lib/cement-recipe-designer.ts'
      - 'src/lib/cement-mineral-extenders*'
      - 'src/lib/cement-program.ts'
      - 'src/lib/cement-product-catalog*'
      - 'src/lib/export-casing-design-docx.ts'
      - 'src/lib/cement-fleet-layout.ts'
      - 'src/lib/__tests__/report-scopes.test.ts'
      - 'src/lib/__tests__/chart-*report.test.ts'
      - 'src/lib/__tests__/cementing-complete-report.test.ts'
      - 'src/lib/displacement-*'
      - 'src/workers/displacement2d.worker.ts'
      - 'src/lib/displacement-*history*'
      - 'src/lib/displacement-history-*'
      - 'src/lib/__tests__/displacement-history-report.test.ts'
      - 'src/lib/__tests__/pipe-spaces-report.test.ts'
      - 'src/lib/__tests__/displacement-timing-report.test.ts'
      - 'src/lib/__tests__/displacement-section-report.test.ts'
      - 'src/lib/__tests__/displacement-placement-report.test.ts'
      - 'src/lib/__tests__/displacement-balance-report.test.ts'
      - 'src/lib/__tests__/fixtures/displacement-section-fixture.ts'
      - 'src/components/displacement/**'
      - 'src/components/CentralizationSection.tsx'
      - 'src/pages/Index.tsx'
      - '.github/workflows/validate-cementing-report.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      REPORT_QA_DIR: /tmp/cementing-report-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx vitest run
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent document renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-dejavu-core
          python3 -m venv /tmp/cementing-report-venv
          /tmp/cementing-report-venv/bin/pip -q install cairosvg pymupdf pillow
      - name: Rasterize actual model figures and regenerate DOCX
        run: |
          /tmp/cementing-report-venv/bin/python - <<'PY'
          import pathlib, os, cairosvg
          d = pathlib.Path(os.environ["REPORT_QA_DIR"])
          for f in d.glob("*.svg"):
              cairosvg.svg2png(url=str(f), write_to=str(f.with_suffix(".png")), scale=1.5)
          PY
          REPORT_QA_RASTER=1 npx vitest run src/lib/__tests__/cementing-complete-report.test.ts src/lib/__tests__/report-scopes.test.ts src/lib/centralizer-ab.test.ts src/lib/__tests__/chart-data-report.test.ts src/lib/__tests__/chart-presentation-report.test.ts src/lib/__tests__/rheology-chart-report.test.ts src/lib/__tests__/basket-chart-report.test.ts src/lib/__tests__/foam-chart-report.test.ts src/lib/__tests__/casing-chart-report.test.ts src/lib/__tests__/hierarchy-chart-report.test.ts src/lib/__tests__/displacement-history-report.test.ts src/lib/__tests__/pipe-spaces-report.test.ts src/lib/__tests__/displacement-timing-report.test.ts src/lib/__tests__/displacement-section-report.test.ts src/lib/__tests__/displacement-placement-report.test.ts src/lib/__tests__/displacement-balance-report.test.ts src/lib/__tests__/fluid-lab-report.test.ts src/lib/__tests__/thermal-report.test.ts src/lib/__tests__/mechanics-report.test.ts
      - name: Verify rendered page geometry and model pages
        run: |
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/cementing-report.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/centralization-report.docx" "$REPORT_QA_DIR/running-report.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/ab-centralization.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/chart-units.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/chart-presentation.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/rheology-coverage.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/basket-coverage.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/foam-coverage.docx" "$REPORT_QA_DIR/foam-main-coverage.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/casing-centralization-coverage.docx" "$REPORT_QA_DIR/casing-running-coverage.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/hierarchy-coverage.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/displacement-history.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/pipe-spaces.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/displacement-timing.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/displacement-section.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/displacement-placement.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/annular-balance.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/fluid-lab.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/thermal.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/mechanics.docx"
          /tmp/cementing-report-venv/bin/python - <<'PY'
          import pathlib, os, base64, fitz
          from PIL import Image
          d = pathlib.Path(os.environ["REPORT_QA_DIR"])
          mechanics_doc=fitz.open(d / "mechanics.pdf")
          mechanics_text=" ".join(" ".join(p.get_text().split()) for p in mechanics_doc)
          assert all(x in mechanics_text for x in ["Удлинение колонны", "Напряжения цементного камня", "Control setting protocol", "Мор-Кулон"])
          assert sum(len(p.get_image_info()) for p in mechanics_doc)==8
          assert all(abs(p.rect.width-595.3)<2 and abs(p.rect.height-841.9)<2 for p in mechanics_doc)
          print("Mechanics report:",len(mechanics_doc),"A4 pages; 8 figures")
          thermal_doc=fitz.open(d / "thermal.pdf")
          thermal_text=" ".join(" ".join(p.get_text().split()) for p in thermal_doc)
          assert all(x in thermal_text for x in ["Итоговые порции", "Баланс энергии", "Истории порций", "Циркуляция"])
          assert sum(len(p.get_image_info()) for p in thermal_doc)==11
          assert all(abs(p.rect.width-595.3)<2 for p in thermal_doc)
          print("Thermal report:",len(thermal_doc),"A4 pages; 11 figures")
          lab_doc=fitz.open(d / "fluid-lab.pdf")
          lab_text=" ".join(" ".join(p.get_text().split()) for p in lab_doc)
          assert all(t in lab_text for t in ["Совместимость смесей", "Washer test protocol 12", "воздействие", "Вымываемость"])
          assert sum(len(p.get_image_info()) for p in lab_doc)==3
          assert all(abs(p.rect.width-595.3)<2 for p in lab_doc)
          lab_preview=Image.new("RGB",(420*len(lab_doc),595),"white")
          for i,page in enumerate(lab_doc):
              pix=page.get_pixmap(matrix=fitz.Matrix(.7,.7),alpha=False)
              lab_preview.paste(Image.frombytes("RGB",(pix.width,pix.height),pix.samples),(i*420,0))
          lab_preview.save(d / "fluid-lab-preview.png",optimize=True)
          print("F11F26_QA_PNG="+base64.b64encode((d / "fluid-lab-preview.png").read_bytes()).decode())
          print("Fluid lab:",len(lab_doc),"pages; 3 figures")
          balance_doc=fitz.open(d / "annular-balance.pdf")
          balance_text=" ".join(" ".join(p.get_text().split()) for p in balance_doc)
          assert all(x in balance_text for x in ["Покомпонентный баланс затрубья","Обратный приток","Округление 3D"])
          assert all(abs(p.rect.width-595.3)<2 for p in balance_doc)
          balance_preview=Image.new("RGB",(600*len(balance_doc),850),"white")
          for i,page in enumerate(balance_doc):
              pix=page.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
              balance_preview.paste(Image.frombytes("RGB",(pix.width,pix.height),pix.samples),(i*600,0))
          balance_preview.save(d / "annular-balance-preview.png",optimize=True)
          print("F05_BALANCE_QA_PNG="+base64.b64encode((d / "annular-balance-preview.png").read_bytes()).decode())
          placement_doc=fitz.open(d / "displacement-placement.pdf")
          placement_text=" ".join(" ".join(p.get_text().split()) for p in placement_doc)
          assert "Конечное размещение" in placement_text and "Невязка профиля трубы" in placement_text
          assert sum(len(p.get_images()) for p in placement_doc)>=1
          for p in placement_doc: assert 590<p.rect.width<600 and 835<p.rect.height<850
          placement_pages=[]
          for page in placement_doc:
              pix=page.get_pixmap(matrix=fitz.Matrix(.7,.7),alpha=False)
              placement_pages.append(Image.frombytes("RGB",(pix.width,pix.height),pix.samples))
          placement_preview=Image.new("RGB",(sum(p.width for p in placement_pages),max(p.height for p in placement_pages)),"white")
          off=0
          for im in placement_pages: placement_preview.paste(im,(off,0));off+=im.width
          placement_preview.save(d / "displacement-placement-preview.png",optimize=True)
          print("F09_QA_PNG="+base64.b64encode((d / "displacement-placement-preview.png").read_bytes()).decode())
          section_doc=fitz.open(d / "displacement-section.pdf")
          section_text=" ".join(" ".join(p.get_text().split()) for p in section_doc)
          assert all(t in section_text for t in ["Сечение трубы", "Смещение осей", "Зазор min / max", "3D", "вид сверху"])
          assert sum(len(p.get_image_info()) for p in section_doc)==2
          assert all(abs(p.rect.width-595.3)<2 for p in section_doc)
          section_preview=Image.new("RGB",(600*len(section_doc),850),"white")
          for i,page in enumerate(section_doc):
              pix=page.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
              section_preview.paste(Image.frombytes("RGB",(pix.width,pix.height),pix.samples),(i*600,0))
          section_preview.save(d / "displacement-section-preview.png",optimize=True)
          print("F08_QA_PNG="+base64.b64encode((d / "displacement-section-preview.png").read_bytes()).decode())
          print("Displacement section:",len(section_doc),"pages; 2 images")
          timing_doc = fitz.open(d / "displacement-timing.pdf")
          timing_text = " ".join(" ".join(p.get_text().split()) for p in timing_doc)
          assert all(t in timing_text for t in ["Временные настройки", "Фактический минимум", "Фактический максимум", "Средний шаг", "Расчёт завершён"])
          assert sum(len(p.get_image_info()) for p in timing_doc) == 1
          assert all(abs(p.rect.width - 595.3) < 2 for p in timing_doc)
          timing_preview=Image.new("RGB",(600*len(timing_doc),850),"white")
          for i,page in enumerate(timing_doc):
              pix=page.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
              timing_preview.paste(Image.frombytes("RGB",(pix.width,pix.height),pix.samples),(i*600,0))
          timing_preview.save(d / "displacement-timing-preview.png",optimize=True)
          print("F07_QA_PNG="+base64.b64encode((d / "displacement-timing-preview.png").read_bytes()).decode())
          print("Displacement timing:",len(timing_doc),"pages; 1 image")
          spaces = fitz.open(d / "pipe-spaces.pdf")
          spaces_text = " ".join(" ".join(p.get_text().split()) for p in spaces)
          assert all(t in spaces_text for t in ["Трубное пространство", "концентрации и баланс", "поршневой перенос", "Продавочная вода", "0.000000"])
          assert "3D-кадр" not in spaces_text
          assert sum(len(p.get_image_info()) for p in spaces) == 1
          assert all(abs(p.rect.width - 595.3) < 2 for p in spaces)
          preview_spaces = Image.new("RGB", (600*len(spaces),850), "white")
          for i,page in enumerate(spaces):
              pix=page.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
              preview_spaces.paste(Image.frombytes("RGB",(pix.width,pix.height),pix.samples),(i*600,0))
          preview_spaces.save(d / "pipe-spaces-preview.png",optimize=True)
          print("F06_QA_PNG="+base64.b64encode((d / "pipe-spaces-preview.png").read_bytes()).decode())
          print("Pipe spaces:",len(spaces),"pages; 1 image")
          history = fitz.open(d / "displacement-history.pdf")
          history_text = " ".join(" ".join(p.get_text().split()) for p in history)
          assert all(t in history_text for t in ["75.00", "25.00", "Цемент G", "1/255", "Доли жидкостей"])
          assert sum(len(p.get_image_info()) for p in history) == 1
          assert all(abs(p.rect.width - 595.3) < 2 for p in history)
          hp = Image.new("RGB", (600*len(history),850), "white")
          for i,page in enumerate(history):
              pix=page.get_pixmap(matrix=fitz.Matrix(1,1),alpha=False)
              hp.paste(Image.frombytes("RGB",(pix.width,pix.height),pix.samples),(i*600,0))
          hp.save(d / "displacement-history-preview.png",optimize=True)
          print("F05_QA_PNG="+base64.b64encode((d / "displacement-history-preview.png").read_bytes()).decode())
          print("Displacement history:",len(history),"pages; 1 image")
          doc = fitz.open(d / "cementing-report.pdf")
          title = doc[0]
          text = title.get_text()
          assert "СОГЛАСОВАНО" in text and "УТВЕРЖДАЮ" in text and "ПРОГРАММА ЦЕМЕНТИРОВАНИЯ" in text, text
          left = title.search_for("СОГЛАСОВАНО")[0]
          right = title.search_for("УТВЕРЖДАЮ")[0]
          assert right.x0 - left.x0 > 180 and abs(left.y0 - right.y0) < 4, (left, right)
          assert abs(title.rect.width - 595.3) < 2, title.rect
          model = next((p for p in doc if "Замещение: 3D-кадр t=" in p.get_text() and p.get_image_info()), None)
          assert model is not None, "Missing rendered displacement model page"
          assert any("Кривые течения" in p.get_text() and p.get_image_info() for p in doc), "Missing rheology flow plot"
          assert any("Остатки реологии" in p.get_text() and p.get_image_info() for p in doc), "Missing rheology residual plot"
          main_text = "\n".join(p.get_text() for p in doc)
          assert all(label not in main_text for label in ["Проверочный стенд движения поршня", "Исследовательский сжимаемый перенос", "PVT-гидростатика"]), "Retired research content leaked into report"
          assert "Давление и ЭЦП на выбранной глубине" in main_text
          assert any("Давление на выбранной глубине:" in " ".join(p.get_text().split()) and p.get_image_info() for p in doc)
          assert any("ЭЦП на выбранной глубине:" in " ".join(p.get_text().split()) and p.get_image_info() for p in doc)
          # Passport references are legitimate input provenance; the passport body must stay out.
          assert "Паспорт оснастки QA-056" in " ".join(main_text.split())
          assert "SECRET-PASSPORT-CONTENT" not in main_text and "Потрубная ведомость" not in main_text
          for stem, required, forbidden in [("centralization", "Расчёт центрирования", "Дохождение колонны:"), ("running", "Расчёт дохождения", "Потрубная ведомость")]:
              scoped = fitz.open(d / (stem + "-report.pdf"))
              text = "\n".join(p.get_text() for p in scoped)
              assert required in text and forbidden not in text and "SECRET-PASSPORT-NOTE" not in text
              assert any(p.get_image_info() for p in scoped), stem + " missing figures"
              assert all(abs(p.rect.width - 595.3) < 2 for p in scoped)
          units = fitz.open(d / "chart-units.pdf")
          units_text = " ".join(" ".join(p.get_text().split()) for p in units)
          assert all(s in units_text for s in ["Глубина TVD, ft", "psi", "ppg (US)", "контрольной выборкой"]), units_text[:200]
          assert sum(len(p.get_image_info()) for p in units) >= 2
          print("Units report:", len(units), "pages;", sum(len(p.get_image_info()) for p in units), "images")
          assert all(abs(p.rect.width - 595.3) < 2 for p in units)
          unit_page = next(p for p in units if p.get_image_info())
          unit_page.get_pixmap(matrix=fitz.Matrix(1,1), alpha=False).save(d / "chart-units-preview.png")
          print("CHART_UNITS_QA_PNG=" + base64.b64encode((d / "chart-units-preview.png").read_bytes()).decode())
          styled = fitz.open(d / "chart-presentation.pdf")
          styled_text = " ".join(" ".join(p.get_text().split()) for p in styled)
          assert "Совмещённый график контрольной программы" in styled_text
          assert "Давление по глубине с увеличенными подписями" in styled_text
          assert sum(len(p.get_image_info()) for p in styled) >= 3
          assert all(abs(p.rect.width - 595.3) < 2 for p in styled)
          styled_pages = [p for p in styled if p.get_image_info()]
          styled_preview = Image.new("RGB", (775 * len(styled_pages), 1095), "white")
          for i, page in enumerate(styled_pages):
              pix = page.get_pixmap(matrix=fitz.Matrix(1.3,1.3), alpha=False)
              styled_preview.paste(Image.frombytes("RGB", (pix.width,pix.height),pix.samples), (i*775,0))
          styled_preview.save(d / "chart-presentation-preview.png", optimize=True)
          print("CHART_PRESENTATION_QA_PNG=" + base64.b64encode((d / "chart-presentation-preview.png").read_bytes()).decode())
          print("Styled report:", len(styled), "pages;", sum(len(p.get_image_info()) for p in styled), "images")
          rheology = fitz.open(d / "rheology-coverage.pdf")
          rheology_text = " ".join(" ".join(p.get_text().split()) for p in rheology)
          assert "Кривые не построены" in rheology_text and "не измерения" in rheology_text
          assert all(abs(p.rect.width - 595.3) < 2 for p in rheology)
          assert sum(len(p.get_image_info()) for p in rheology) >= 2
          rheology_pages = [p for p in rheology if p.get_image_info()]
          rheology_preview = Image.new("RGB", (775 * len(rheology_pages), 1095), "white")
          for i, page in enumerate(rheology_pages):
              pix = page.get_pixmap(matrix=fitz.Matrix(1.3,1.3), alpha=False)
              rheology_preview.paste(Image.frombytes("RGB", (pix.width,pix.height),pix.samples), (i*775,0))
          rheology_preview.save(d / "rheology-coverage-preview.png", optimize=True)
          print("RHEOLOGY_QA_PNG=" + base64.b64encode((d / "rheology-coverage-preview.png").read_bytes()).decode())
