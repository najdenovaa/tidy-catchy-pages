name: Validate complete cementing report
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/*report*'
      - 'src/lib/compressible-*'
      - 'src/lib/transport-refinement*'
      - 'src/lib/transport-mesh*'
      - 'src/lib/__tests__/compressible-report.test.ts'
      - 'src/lib/export-docx.ts'
      - 'src/lib/cement-recipe-designer.ts'
      - 'src/lib/cement-mineral-extenders*'
      - 'src/lib/cement-program.ts'
      - 'src/lib/cement-product-catalog*'
      - 'src/lib/export-casing-design-docx.ts'
      - 'src/lib/cement-fleet-layout.ts'
      - 'src/lib/__tests__/report-scopes.test.ts'
      - 'src/lib/__tests__/cementing-complete-report.test.ts'
      - 'src/lib/displacement-geometry.ts'
      - 'src/components/displacement/**'
      - 'src/components/CentralizationSection.tsx'
      - 'src/pages/Index.tsx'
      - '.github/workflows/validate-cementing-report.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      REPORT_QA_DIR: /tmp/cementing-report-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx vitest run
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install independent document renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer fonts-dejavu-core
          python3 -m venv /tmp/cementing-report-venv
          /tmp/cementing-report-venv/bin/pip -q install cairosvg pymupdf pillow
      - name: Rasterize actual model figures and regenerate DOCX
        run: |
          /tmp/cementing-report-venv/bin/python - <<'PY'
          import pathlib, os, cairosvg
          d = pathlib.Path(os.environ["REPORT_QA_DIR"])
          for f in d.glob("*.svg"):
              cairosvg.svg2png(url=str(f), write_to=str(f.with_suffix(".png")), scale=1.5)
          PY
          REPORT_QA_RASTER=1 npx vitest run src/lib/__tests__/cementing-complete-report.test.ts src/lib/__tests__/report-scopes.test.ts src/lib/__tests__/compressible-report.test.ts
      - name: Verify rendered page geometry and model pages
        run: |
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/cementing-report.docx"
          libreoffice -env:UserInstallation=file:///tmp/cementing-lo --headless --convert-to pdf --outdir "$REPORT_QA_DIR" "$REPORT_QA_DIR/centralization-report.docx" "$REPORT_QA_DIR/running-report.docx" "$REPORT_QA_DIR/transport-report.docx"
          /tmp/cementing-report-venv/bin/python - <<'PY'
          import pathlib, os, base64, fitz
          from PIL import Image
          d = pathlib.Path(os.environ["REPORT_QA_DIR"])
          doc = fitz.open(d / "cementing-report.pdf")
          title = doc[0]
          text = title.get_text()
          assert "СОГЛАСОВАНО" in text and "УТВЕРЖДАЮ" in text and "ПРОГРАММА ЦЕМЕНТИРОВАНИЯ" in text, text
          left = title.search_for("СОГЛАСОВАНО")[0]
          right = title.search_for("УТВЕРЖДАЮ")[0]
          assert right.x0 - left.x0 > 180 and abs(left.y0 - right.y0) < 4, (left, right)
          assert abs(title.rect.width - 595.3) < 2, title.rect
          model = next((p for p in doc if "Замещение: 3D-кадр t=" in p.get_text() and p.get_image_info()), None)
          assert model is not None, "Missing rendered displacement model page"
          assert any("Кривые течения" in p.get_text() and p.get_image_info() for p in doc), "Missing rheology flow plot"
          assert any("Остатки реологии" in p.get_text() and p.get_image_info() for p in doc), "Missing rheology residual plot"
          main_text = "\n".join(p.get_text() for p in doc)
          # Passport references are legitimate input provenance; the passport body must stay out.
          assert "Паспорт оснастки QA-056" in " ".join(main_text.split())
          assert "SECRET-PASSPORT-CONTENT" not in main_text and "Потрубная ведомость" not in main_text
          for stem, required, forbidden in [("centralization", "Расчёт центрирования", "Дохождение колонны:"), ("running", "Расчёт дохождения", "Потрубная ведомость")]:
              scoped = fitz.open(d / (stem + "-report.pdf"))
              text = "\n".join(p.get_text() for p in scoped)
              assert required in text and forbidden not in text and "SECRET-PASSPORT-NOTE" not in text
              assert any(p.get_image_info() for p in scoped), stem + " missing figures"
              assert all(abs(p.rect.width - 595.3) < 2 for p in scoped)
          transport = fitz.open(d / "transport-report.pdf")
          assert any("1D-перенос: давление" in " ".join(p.get_text().split()) and p.get_image_info() for p in transport), "Missing transport pressure plot"
          transport_text = " ".join(" ".join(p.get_text().split()) for p in transport)
          assert "накопленная невязка" in transport_text
          assert "Чувствительность к сетке и шагу" in transport_text and "L1 состава (0-2)" in transport_text
          assert "После перекрытия" in transport_text and "разность массы через ЦКОД" in transport_text
          assert "Герметичное перекрытие задано пользователем" in transport_text
          print("Rendered", len(doc), "A4 pages; approval-column separation", round(right.x0 - left.x0), "pt; model page", model.number + 1)
          preview = Image.new("RGB", (1000, 710), "white")
          for i, page in enumerate([title, model]):
              pix = page.get_pixmap(matrix=fitz.Matrix(.83, .83), alpha=False)
              im = Image.frombytes("RGB", (pix.width, pix.height), pix.samples)
              preview.paste(im, (i * 500, 0))
          out = d / "report-preview.png"
          preview.save(out, optimize=True)
          print("REPORT_QA_PNG=" + base64.b64encode(out.read_bytes()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cementing-report-layout
          path: |
            /tmp/cementing-report-qa/cementing-report.docx
            /tmp/cementing-report-qa/cementing-report.pdf
            /tmp/cementing-report-qa/report-preview.png
            /tmp/cementing-report-qa/centralization-report.docx
            /tmp/cementing-report-qa/centralization-report.pdf
            /tmp/cementing-report-qa/running-report.docx
            /tmp/cementing-report-qa/running-report.pdf
            /tmp/cementing-report-qa/fleet-layout.svg
            /tmp/cementing-report-qa/transport-report.docx
            /tmp/cementing-report-qa/transport-report.pdf
