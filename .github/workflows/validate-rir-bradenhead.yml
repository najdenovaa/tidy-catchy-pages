name: Validate RIR Bradenhead
on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/rir-spot-squeeze*"
      - "src/components/rir/RirSpotLiftSqueeze.tsx"
      - "src/components/rir/RirModule.tsx"
      - ".github/workflows/validate-rir-bradenhead.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Model tests
        run: npx vitest run src/lib/rir-spot-squeeze.test.ts src/lib/rir.test.ts
      - name: Production build
        run: npm run build
