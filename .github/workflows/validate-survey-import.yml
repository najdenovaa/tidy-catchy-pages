name: Validate unified survey import
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/well-survey-*'
      - 'src/components/WellSurveyImport*'
      - 'src/components/InputSection.tsx'
      - 'src/lib/well-geometry*'
      - 'public/trajectory_template.xlsx'
      - '.github/workflows/validate-survey-import.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx vitest run
      - run: npm run build
