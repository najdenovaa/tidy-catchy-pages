name: Validate mobile exchange
on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/cementing-mobile-exchange.ts"
      - "src/lib/cementing-mobile-exchange.test.ts"
      - "src/components/CementingMobileExchange.tsx"
      - "src/pages/Index.tsx"
      - ".github/workflows/validate-mobile-exchange.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Exchange tests
        run: npx vitest run src/lib/cementing-mobile-exchange.test.ts
      - name: Production build
        run: npm run build
