name: Deploy to Selectel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-selectel-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Determine IP directory month
        id: ip-directory-month
        run: date -u '+month=%Y-%m' >> "$GITHUB_OUTPUT"

      - name: Cache built IP directory
        uses: actions/cache@v4
        with:
          path: .cache/ip-directory
          key: ip-directory-${{ steps.ip-directory-month.outputs.month }}-${{ hashFiles('scripts/build-ip-directory.py') }}

      - name: Bundle IP directory
        continue-on-error: true
        run: |
          if [ ! -f .cache/ip-directory/catalog.json ]; then
            python3 scripts/build-ip-directory.py .cache/ip-directory
          fi
          cp -a .cache/ip-directory dist/

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publish static build (rsync)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          preserve_ip_directory=()
          if [ ! -f dist/ip-directory/catalog.json ]; then
            preserve_ip_directory=(--filter='protect /ip-directory/***')
          fi
          rsync -avz --delete --omit-dir-times "${preserve_ip_directory[@]}" \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" \
            dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/deallsoft/dist/"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'find /var/www/deallsoft/dist -type d -exec chmod 755 {} +; find /var/www/deallsoft/dist -type f -exec chmod 644 {} +'
