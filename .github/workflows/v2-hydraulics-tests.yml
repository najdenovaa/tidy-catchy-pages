name: V2 Hydraulics Tests

on:
  push:
    branches:
      - feature/advanced-hydraulics-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run V2 and hydraulics regression tests
        run: npx vitest run src/lib/advanced-pipe-hydraulics-v2.test.ts src/lib/advanced-multifluid-pipe-v2.test.ts src/lib/advanced-hydraulics-analytical.test.ts src/lib/cementing-hydraulics.test.ts src/lib/cement-program.test.ts
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
