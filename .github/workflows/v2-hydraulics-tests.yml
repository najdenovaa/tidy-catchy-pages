name: V2 Hydraulics Tests

on:
  push:
    branches:
      - feature/advanced-hydraulics-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run V2 and hydraulics regression tests
        run: npx vitest run src/lib/advanced-pipe-hydraulics-v2.test.ts src/lib/advanced-multifluid-pipe-v2.test.ts src/lib/advanced-pipe-advection-v2.test.ts src/lib/advanced-pipe-pressure-v2.test.ts src/lib/advanced-pipe-timeline-v2.test.ts src/lib/advanced-annulus-v2.test.ts src/lib/advanced-hydraulics-analytical.test.ts src/lib/cementing-hydraulics.test.ts src/lib/cement-program.test.ts src/lib/advanced-coupled-hydraulics-v2.test.ts src/lib/advanced-annular-geometry-v2.test.ts src/lib/cementing-engine-integration.test.ts src/lib/advanced-v2-compatibility.test.ts src/lib/advanced-safe-rate-v2.test.ts src/lib/advanced-stop-diagnostics-v2.test.ts src/lib/advanced-pump-timeline-v2.test.ts src/lib/advanced-restart-gel-v2.test.ts src/lib/advanced-restart-pressure-frames-v2.test.ts src/lib/advanced-v2-chart-data.test.ts src/lib/cementing-engine-restart-integration.test.ts src/lib/advanced-v2-formation-summary.test.ts src/lib/advanced-v2-pressure-projection.test.ts src/lib/advanced-v2-stage-metadata.test.ts src/lib/advanced-pump-pause-integration-v2.test.ts src/lib/advanced-v2-pump-pressure-safety.test.ts src/lib/advanced-v2-fluid-frame-integration.test.ts src/lib/advanced-v2-unified-timeline.test.ts src/lib/advanced-v2-static-stop-coupling.test.ts src/lib/advanced-v2-woc-hydrostatics.test.ts
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build verification (without deployment)
        run: npm run build
