name: Validate RIR full module parity
on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/rir-*"
      - "src/components/rir/**"
      - "src/hooks/use-rir-cursor*"
      - "src/pages/CementPlug.tsx"
      - "src/test/fixtures/rir-screenshot.ts"
      - ".github/workflows/validate-rir-parity.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dependencies
        run: npm install --legacy-peer-deps
      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: RIR tests
        run: npx vitest run
      - name: Build
        run: npm run build
