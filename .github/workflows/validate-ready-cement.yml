name: Validate ready cement systems
on:
  pull_request:
    branches: [main]
    paths:
      - "src/components/ReadyCementAlternatives.tsx"
      - "src/components/LabTargetsPanel.tsx"
      - "src/components/PlugRecipeCard.tsx"
      - "src/test/nefteservis-systems.test.ts"
      - "src/components/ExtenderSelector*"
      - "src/components/RecipeDoseTable.tsx"
      - "src/components/CementProductPicker.tsx"
      - "src/components/InputSection.tsx"
      - "src/components/WellSurveyImport*"
      - "src/lib/well-survey-import*"
      - "src/lib/well-geometry*"
      - "src/lib/fluid-library*"
      - "src/lib/cement-rheology*"
      - "src/lib/rheology-*"
      - "src/lib/cementing-process*"
      - "src/lib/fluid-inventory*"
      - "src/lib/stop-storage*"
      - "src/lib/pvt-hydrostatics*"
      - "src/components/PvtHydrostatics*"
      - "src/components/StopStorage*"
      - "src/lib/cementing-inventory*"
      - "src/components/FluidInventoryPanel*"
      - "src/components/PumpingSchedule*"
      - "src/components/InputSection*"
      - "src/components/FannEditor*"
      - "src/lib/equipment-library*"
      - "src/components/EquipmentLibrary*"
      - "src/lib/cementing-equipment.ts"
      - "src/components/CentralizerPassportFields.tsx"
      - "src/components/FluidLibrary*"
      - "src/components/WellGeometrySummary*"
      - "src/lib/cement-mineral-extenders*"
      - "src/lib/cement-recipe-designer.ts"
      - "src/lib/cement-product-catalog*"
      - "src/lib/cement-program.ts"
      - ".github/workflows/validate-ready-cement.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Catalog tests
        run: npx vitest run --maxWorkers=2
      - name: Production build
        run: npm run build
