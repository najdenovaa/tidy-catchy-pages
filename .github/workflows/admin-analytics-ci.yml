name: Verify admin analytics changes
on:
  push:
    branches: [fix/admin-stats-ip-enrichment]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --legacy-peer-deps
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: npm run build
