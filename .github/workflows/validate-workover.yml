name: Validate workover calculations and workflow
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/workover-*'
      - 'src/hooks/use-workover-draft*'
      - 'src/pages/Workover*'
      - '.github/workflows/validate-workover.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx vitest run src/lib/workover-calculations.test.ts src/lib/workover-operations.test.ts src/lib/workover-validation.test.ts src/hooks/use-workover-draft.test.tsx src/pages/Workover.test.tsx
      - run: npm run build
